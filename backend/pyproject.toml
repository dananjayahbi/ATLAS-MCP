[project]
name = "atlas-mcp-backend"
version = "1.0.0"
description = "ATLAS-MCP Django backend: domain core, REST API, SSE transport"
requires-python = ">=3.11"
dependencies = [
    "Django==5.2.7",
    "djangorestframework==3.16.1",
    "django-cors-headers==4.4.0",
    "httpx==0.27.2",
]

[project.optional-dependencies]
dev = [
    "pytest==8.3.3",
    "pytest-django==4.9.0",
]

[tool.pytest.ini_options]
DJANGO_SETTINGS_MODULE = "atlas.settings.dev"
pythonpath = ["backend"]
testpaths = ["tests"]
addopts = "-q --strict-markers"
markers = [
    "integration: touches the database",
    "e2e: full-stack behaviour",
]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
ignore = ["B008"]
